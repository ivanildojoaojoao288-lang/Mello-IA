<div class="input-box">

    <!-- ANEXAR IMAGEM -->
    <input
        type="file"
        id="image-input"
        accept="image/*"
        hidden
    >

    <button
        type="button"
        class="attach-button"
        id="attach-button"
        title="Enviar imagem"
        onclick="document.getElementById('image-input').click()"
    >
        <span>＋</span>
    </button>


    <!-- CAMPO DE TEXTO -->
    <textarea
        id="user-input"
        rows="1"
        placeholder="Comande a Mello IA..."
        onkeydown="handleKey(event)"
    ></textarea>


    <!-- MICROFONE ULTRA -->
    <button
        type="button"
        class="voice-button"
        id="voice-button"
        onclick="alternarMicrofone()"
        title="Falar com a Mello IA"
        aria-label="Falar com a Mello IA"
    >

        <span class="voice-ring ring-1"></span>
        <span class="voice-ring ring-2"></span>

        <svg
            class="mic-icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >
            <rect
                x="9"
                y="3"
                width="6"
                height="11"
                rx="3"
                stroke="currentColor"
                stroke-width="1.8"
            />

            <path
                d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
            />

            <path
                d="M12 18V21"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
            />

            <path
                d="M9 21H15"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
            />
        </svg>

    </button>


    <!-- ENVIAR -->
    <button
        type="button"
        class="send-button"
        id="send-button"
        onclick="enviarMensagem()"
        title="Enviar"
    >
        ➤
    </button>

</div>


<!-- STATUS DA VOZ -->
<div
    class="voice-status"
    id="voice-status"
    aria-live="polite"
>
    <span class="voice-status-dot"></span>
    <span id="voice-status-text">
        Pronto para ouvir
    </span>
</div>
