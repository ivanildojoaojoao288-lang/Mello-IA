<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0284c7"
    >

    <meta
        name="description"
        content="Mello IA — Assistente Inteligente"
    >

    <title>Mello IA</title>


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >


    <!-- =====================================================
         MARKDOWN
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js">
    </script>


    <!-- =====================================================
         KATEX
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js">
    </script>

</head>


<body>

<div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="brand">

            <div class="brand-logo">
                M
            </div>

            <div>

                <div class="brand-name">
                    Mello IA
                </div>

                <div class="brand-version">
                    AI Assistant
                </div>

            </div>

        </div>


        <button
            class="new-chat"
            type="button"
            onclick="novaConversa()"
        >

            <span>＋</span>

            Nova conversa

        </button>


        <div class="sidebar-section">
            CONVERSAS
        </div>


        <div
            id="history"
            class="history"
        >
        </div>


        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                type="button"
            >

                ⚙️

                <span>
                    Definições
                </span>

            </button>


            <button
                class="sidebar-button"
                type="button"
            >

                ℹ️

                <span>
                    Sobre a Mello IA
                </span>

            </button>


            <div class="creator-mini">

                Desenvolvida por<br>

                <strong>
                    Eng. Ivanildo João Paulo Augusto
                </strong>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         ÁREA PRINCIPAL
         ===================================================== -->

    <main class="main">


        <!-- =================================================
             TOPBAR
             ================================================= -->

        <header class="topbar">

            <button
                class="menu-button"
                type="button"
                onclick="toggleSidebar()"
                aria-label="Abrir menu"
            >

                ☰

            </button>


            <div class="topbar-title">

                <div class="mini-logo">
                    M
                </div>

                <div>

                    <strong>
                        Mello IA
                    </strong>

                    <span>
                        Assistente inteligente
                    </span>

                </div>

            </div>


            <button
                class="new-mobile"
                type="button"
                onclick="novaConversa()"
                title="Nova conversa"
                aria-label="Nova conversa"
            >

                ＋

            </button>

        </header>


        <!-- =================================================
             CHAT
             ================================================= -->

        <section
            class="chat-area"
            id="chat-box"
        >

            <!-- =================================================
                 TELA INICIAL
                 ================================================= -->

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">
                    M
                </div>


                <h1>

                    Olá! Eu sou a

                    <span>
                        Mello IA
                    </span>

                </h1>


                <p>

                    Assistente inteligente de tecnologia,
                    programação, estudos e inovação.

                </p>


                <!-- =================================================
                     SUGESTÕES
                     ================================================= -->

                <div class="suggestions">


                    <button
                        type="button"
                        onclick="usarSugestao('Explique-me inteligência artificial de forma simples')"
                    >

                        🤖

                        <span>

                            <strong>
                                Inteligência Artificial
                            </strong>

                            Aprender conceitos de IA

                        </span>

                    </button>


                    <button
                        type="button"
                        onclick="usarSugestao('Ajude-me a aprender programação')"
                    >

                        💻

                        <span>

                            <strong>
                                Programação
                            </strong>

                            Aprender a programar

                        </span>

                    </button>


                    <button
                        type="button"
                        onclick="usarSugestao('Ajude-me com os meus estudos')"
                    >

                        📚

                        <span>

                            <strong>
                                Estudos
                            </strong>

                            Explicar matérias

                        </span>

                    </button>


                    <button
                        type="button"
                        onclick="usarSugestao('Explique redes de computadores')"
                    >

                        🌐

                        <span>

                            <strong>
                                Tecnologia
                            </strong>

                            Redes e informática

                        </span>

                    </button>


                </div>

            </div>

        </section>


        <!-- =================================================
             ÁREA DE INPUT
             ================================================= -->

        <div class="input-wrapper">


            <!-- =================================================
                 PREVIEW DA IMAGEM
                 ================================================= -->

            <div
                class="image-preview"
                id="image-preview"
                style="display: none;"
            >

                <img
                    id="preview-image"
                    src=""
                    alt="Pré-visualização da imagem"
                >


                <div class="image-preview-info">

                    <span id="image-name"></span>


                    <button
                        type="button"
                        onclick="removerImagem()"
                        title="Remover imagem"
                        aria-label="Remover imagem"
                    >

                        ×

                    </button>

                </div>

            </div>


            <!-- =================================================
                 CAIXA DE TEXTO
                 ================================================= -->

            <div class="input-box">


                <!-- INPUT DE IMAGEM -->

                <input
                    type="file"
                    id="image-input"
                    accept="image/*"
                    hidden
                >


                <!-- ANEXAR IMAGEM -->

                <button
                    type="button"
                    class="attach-button"
                    id="attach-button"
                    title="Enviar foto"
                    aria-label="Enviar foto"
                    onclick="document.getElementById('image-input').click()"
                >

                    ＋

                </button>


                <!-- TEXTO -->

                <textarea
                    id="user-input"
                    rows="1"
                    placeholder="Comande a Mello IA..."
                    onkeydown="handleKey(event)"
                    autocomplete="off"
                ></textarea>


                <!-- MICROFONE -->

                <button
                    type="button"
                    class="voice-button"
                    id="voice-button"
                    title="Falar com a Mello IA"
                    aria-label="Falar com a Mello IA"
                    onclick="alternarMicrofone()"
                >

                    🎙️

                </button>


                <!-- ENVIAR -->

                <button
                    type="button"
                    class="send-button"
                    id="send-button"
                    title="Enviar mensagem"
                    aria-label="Enviar mensagem"
                    onclick="enviarMensagem()"
                >

                    ➤

                </button>

            </div>


            <!-- =================================================
                 ESTADO DO MICROFONE
                 ================================================= -->

            <div
                class="voice-status"
                id="voice-status"
            ></div>


            <!-- =================================================
                 AVISO
                 ================================================= -->

            <div class="input-info">

                A Mello IA pode cometer erros.
                Verifique informações importantes.

            </div>

        </div>

    </main>

</div>


<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script
    src="{{ url_for('static', filename='script.js') }}">
</script>


</body>

</html>
