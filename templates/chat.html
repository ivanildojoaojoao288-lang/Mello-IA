<script>
async function send() {
    const msg = document.getElementById('cmd').value;

    const res = await fetch('/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: msg
        })
    });

    const data = await res.json();

    document.getElementById('console').innerHTML += 
    `<div>> ${data.reply}</div>`;
}
</script>
