<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mello IA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-logo">M</div>

            <div>
                <div class="brand-name">Mello IA</div>
                <div class="brand-version">AI Assistant</div>
            </div>
        </div>

        <button class="new-chat" onclick="novaConversa()">
            <span>＋</span>
            Nova conversa
        </button>

        <div class="sidebar-section">
            <span>CONVERSAS</span>
        </div>

        <div id="history" class="history">
            <!-- Conversas futuras aparecerão aqui -->
        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-button">
                ⚙️
                <span>Definições</span>
            </button>

            <button class="sidebar-button">
                ℹ️
                <span>Sobre a Mello IA</span>
            </button>

            <div class="creator-mini">
                Desenvolvida por<br>
                <strong>Eng. Ivanildo João Paulo Augusto</strong>
            </div>

        </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->
    <main class="main">

        <!-- CABEÇALHO -->
        <header class="topbar">

            <button class="menu-button" onclick="toggleSidebar()">
                ☰
            </button>

            <div class="topbar-title">
                <div class="mini-logo">M</div>

                <div>
                    <strong>Mello IA</strong>
                    <span>Assistente inteligente</span>
                </div>
            </div>

            <button class="new-mobile" onclick="novaConversa()">
                ＋
            </button>

        </header>


        <!-- CHAT -->
        <section class="chat-area" id="chat-box">

            <!-- MENSAGEM INICIAL -->

            <div class="welcome" id="welcome">

                <div class="welcome-logo">
                    M
                </div>

                <h1>
                    Olá! Eu sou a <span>Mello IA</span>
                </h1>

                <p>
                    Assistente inteligente de tecnologia,
                    programação, estudos e inovação.
                </p>


                <div class="suggestions">

                    <button onclick="usarSugestao('Explique-me inteligência artificial de forma simples')">
                        🤖
                        <span>
                            <strong>Inteligência Artificial</strong>
                            Aprender conceitos de IA
                        </span>
                    </button>

                    <button onclick="usarSugestao('Ajude-me a aprender programação')">
                        💻
                        <span>
                            <strong>Programação</strong>
                            Aprender a programar
                        </span>
                    </button>

                    <button onclick="usarSugestao('Ajude-me com os meus estudos')">
                        📚
                        <span>
                            <strong>Estudos</strong>
                            Explicar matérias
                        </span>
                    </button>

                    <button onclick="usarSugestao('Explique redes de computadores')">
                        🌐
                        <span>
                            <strong>Tecnologia</strong>
                            Redes e informática
                        </span>
                    </button>

                </div>

            </div>

        </section>


        <!-- ÁREA DE INPUT -->
        <div class="input-wrapper">

            <div class="input-box">

                <button class="attach-button" title="Anexar ficheiro">
                    ＋
                </button>

                <textarea
                    id="user-input"
                    rows="1"
                    placeholder="Comande a Mello IA..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send-button"
                    id="send-button"
                    onclick="enviarMensagem()"
                    title="Enviar mensagem"
                >
                    ➤
                </button>

            </div>

            <div class="input-info">
                A Mello IA pode cometer erros. Verifique informações importantes.
            </div>

        </div>


    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
