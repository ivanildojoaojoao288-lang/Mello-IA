<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Mello IA — Assistente inteligente de tecnologia, programação, estudos e inovação.">

    <title>Mello IA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- =========================================
     APLICAÇÃO
     ========================================= -->

<div class="app">


    <!-- =========================================
         MENU LATERAL
         ========================================= -->

    <aside class="sidebar"
           id="sidebar">


        <!-- MARCA -->

        <div class="brand">

            <div class="brand-logo">
                M
            </div>

            <div>

                <div class="brand-name">
                    Mello IA
                </div>

                <div class="brand-version">
                    AI Assistant
                </div>

            </div>

        </div>


        <!-- NOVA CONVERSA -->

        <button class="new-chat"
                type="button"
                onclick="novaConversa()">

            <span>＋</span>

            <span>
                Nova conversa
            </span>

        </button>


        <!-- SECÇÃO -->

        <div class="sidebar-section">

            CONVERSAS

        </div>


        <!-- HISTÓRICO -->

        <div id="history"
             class="history">

            <!-- As conversas serão adicionadas pelo JavaScript -->

        </div>


        <!-- PARTE INFERIOR -->

        <div class="sidebar-bottom">


            <button class="sidebar-button"
                    type="button">

                <span>⚙️</span>

                <span>
                    Definições
                </span>

            </button>


            <button class="sidebar-button"
                    type="button">

                <span>ℹ️</span>

                <span>
                    Sobre a Mello IA
                </span>

            </button>


            <div class="creator-mini">

                Desenvolvida por<br>

                <strong>
                    Eng. Ivanildo João Paulo Augusto
                </strong>

            </div>


        </div>


    </aside>



    <!-- =========================================
         ÁREA PRINCIPAL
         ========================================= -->

    <main class="main">


        <!-- =========================================
             TOPO
             ========================================= -->

        <header class="topbar">


            <!-- MENU MOBILE -->

            <button class="menu-button"
                    type="button"
                    onclick="toggleSidebar()"
                    aria-label="Abrir menu">

                ☰

            </button>


            <!-- IDENTIDADE -->

            <div class="topbar-title">


                <div class="mini-logo">
                    M
                </div>


                <div>

                    <strong>
                        Mello IA
                    </strong>

                    <span>
                        Assistente inteligente
                    </span>

                </div>


            </div>


            <!-- NOVA CONVERSA MOBILE -->

            <button class="new-mobile"
                    type="button"
                    onclick="novaConversa()"
                    aria-label="Nova conversa">

                ＋

            </button>


        </header>



        <!-- =========================================
             ÁREA DO CHAT
             ========================================= -->

        <section class="chat-area"
                 id="chat-box">


            <!-- =====================================
                 BOAS-VINDAS
                 ===================================== -->

            <div class="welcome"
                 id="welcome">


                <div class="welcome-logo">
                    M
                </div>


                <h1>

                    Olá! Eu sou a
                    <span>
                        Mello IA
                    </span>

                </h1>


                <p>

                    Assistente inteligente de tecnologia,
                    programação, estudos e inovação.

                </p>


                <!-- =================================
                     SUGESTÕES
                     ================================= -->

                <div class="suggestions">


                    <button
                        type="button"
                        onclick="usarSugestao('Explique-me inteligência artificial de forma simples')">

                        <span>
                            🤖
                        </span>

                        <span>

                            <strong>
                                Inteligência Artificial
                            </strong>

                            Aprender conceitos de IA

                        </span>

                    </button>



                    <button
                        type="button"
                        onclick="usarSugestao('Ajude-me a aprender programação')">

                        <span>
                            💻
                        </span>

                        <span>

                            <strong>
                                Programação
                            </strong>

                            Aprender a programar

                        </span>

                    </button>



                    <button
                        type="button"
                        onclick="usarSugestao('Ajude-me com os meus estudos')">

                        <span>
                            📚
                        </span>

                        <span>

                            <strong>
                                Estudos
                            </strong>

                            Explicar matérias

                        </span>

                    </button>



                    <button
                        type="button"
                        onclick="usarSugestao('Explique redes de computadores')">

                        <span>
                            🌐
                        </span>

                        <span>

                            <strong>
                                Tecnologia
                            </strong>

                            Redes e informática

                        </span>

                    </button>


                </div>


            </div>


        </section>



        <!-- =========================================
             ÁREA DE INPUT
             ========================================= -->

        <div class="input-wrapper">


            <!-- =====================================
                 PREVIEW DA IMAGEM
                 ===================================== -->

            <div class="image-preview"
                 id="image-preview">


                <img id="image-preview-img"
                     src=""
                     alt="Pré-visualização da imagem">


                <div class="image-preview-info">


                    <div class="image-preview-name"
                         id="image-preview-name">

                        Imagem selecionada

                    </div>


                    <div class="image-preview-label">

                        Preparada para análise pela Mello IA

                    </div>


                </div>


                <button class="remove-image"
                        id="remove-image"
                        type="button"
                        onclick="removerImagem()"
                        aria-label="Remover imagem">

                    ×

                </button>


            </div>



            <!-- =====================================
                 CAIXA DE MENSAGEM
                 ===================================== -->

            <div class="input-box">


                <!-- INPUT DE FICHEIRO -->

                <input
                    type="file"
                    id="image-input"
                    class="file-input"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                >


                <!-- BOTÃO ANEXAR -->

                <button
                    class="attach-button"
                    id="attach-button"
                    type="button"
                    title="Enviar imagem"
                    aria-label="Enviar imagem"
                    onclick="abrirSeletorImagem()">

                    ＋

                </button>



                <!-- CAMPO DE TEXTO -->

                <textarea
                    id="user-input"
                    rows="1"
                    maxlength="10000"
                    placeholder
