<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Entrar — Mello IA</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="auth-container">

```
<div class="auth-card">

    <div class="auth-logo">
        M
    </div>

    <h1>Bem-vindo à <span>Mello IA</span></h1>

    <p class="auth-subtitle">
        Entre na sua conta para continuar.
    </p>

    <button
        type="button"
        id="google-login"
        class="google-button"
    >
        <span>G</span>
        Continuar com Google
    </button>

    <div class="divider">
        <span>ou</span>
    </div>

    <form id="login-form">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
        >

        <label for="password">
            Palavra-passe
        </label>

        <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
        >

        <button
            type="submit"
            id="login-button"
            class="auth-button"
        >
            Entrar
        </button>

    </form>

    <p id="auth-message" class="auth-message"></p>

    <p class="auth-link">
        Ainda não tens conta?
        <a href="/register">Criar conta</a>
    </p>

</div>
```

</div>

<script type="module"
        src="{{ url_for('static', filename='login.js') }}">
</script>

</body>
</html>
