<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Criar conta — Mello IA</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="auth-container">

```
<div class="auth-card">

    <div class="auth-logo">
        M
    </div>

    <h1>Criar conta na <span>Mello IA</span></h1>

    <p class="auth-subtitle">
        Crie a sua conta gratuitamente.
    </p>

    <button
        type="button"
        id="google-register"
        class="google-button"
    >
        <span>G</span>
        Criar conta com Google
    </button>

    <div class="divider">
        <span>ou</span>
    </div>

    <form id="register-form">

        <label for="name">
            Nome
        </label>

        <input
            type="text"
            id="name"
            placeholder="Seu nome"
            required
        >

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
        >

        <label for="password">
            Palavra-passe
        </label>

        <input
            type="password"
            id="password"
            placeholder="Mínimo de 6 caracteres"
            minlength="6"
            required
        >

        <button
            type="submit"
            id="register-button"
            class="auth-button"
        >
            Criar conta
        </button>

    </form>

    <p id="auth-message" class="auth-message"></p>

    <p class="auth-link">
        Já tens uma conta?
        <a href="/login">Entrar</a>
    </p>

</div>
```

</div>

<script type="module"
        src="{{ url_for('static', filename='login.js') }}">
</script>

</body>
</html>
