<div id="chat-box" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; margin-bottom: 10px;"></div>
<input type="text" id="user-input" placeholder="Escreva algo...">
<button onclick="enviarMensagem()">Enviar</button>

<script>
async function enviarMensagem() {
    const input = document.getElementById('user-input');
    const msg = input.value;
    if (!msg) return; // Não envia se estiver vazio

    console.log("A enviar:", msg);

    try {
        const res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: msg})
        });

        // Verifica se o servidor respondeu com erro (ex: 500)
        if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`);

        const data = await res.json();
        
        // Exibe na tela
        document.getElementById('chat-box').innerHTML += `<p><b>Você:</b> ${msg}</p>`;
        document.getElementById('chat-box').innerHTML += `<p><b>Mello IA:</b> ${data.reply}</p>`;
        
        // Limpa o campo de entrada
        input.value = '';
    } catch (e) {
        console.error("Erro na comunicação:", e);
        document.getElementById('chat-box').innerHTML += `<p style="color:red;">Erro: O servidor não respondeu. Verifique o terminal.</p>`;
    }
}
</script>
